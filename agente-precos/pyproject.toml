[project]
name = "agente-precos"
version = "0.1.0"
description = "Agente de inteligência de preços: verifica ofertas na fonte, compara pagamentos e recomenda com evidências."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.optional-dependencies]
render = ["playwright>=1.40"]

[project.scripts]
precos = "precos.cli:main"

[tool.setuptools]
packages = ["precos"]
